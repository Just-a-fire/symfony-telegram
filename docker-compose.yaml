services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/html
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"

  frontend:
    build:
      context: .
      dockerfile: docker/nodejs/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "${REACT_EXTERNAL_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_REACT_EXTERNAL_PORT=${REACT_EXTERNAL_PORT}
      - CHOKIDAR_USEPOLLING=true # Hot Reload в Docker
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_EXTERNAL_PORT}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

volumes:
  db_pg_data:
